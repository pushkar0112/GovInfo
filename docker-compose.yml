version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: govinnovate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govinnovate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govinnovate_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-govinnovate_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-govinnovate} -d ${POSTGRES_DB:-govinnovate_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - govinnovate-net

  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govinnovate-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-govinnovate}:${POSTGRES_PASSWORD:-govinnovate_secure_pass}@postgres:5432/${POSTGRES_DB:-govinnovate_db}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-jwt-secret-min-32-chars}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]'
      API_V1_STR: /api/v1
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - govinnovate-net

  # ----------------------------------------------------------------------------
  # Frontend Application Service (Next.js)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: govinnovate-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-GovInnovate}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - govinnovate-net

# ------------------------------------------------------------------------------
# Persistent Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

networks:
  govinnovate-net:
    driver: bridge
